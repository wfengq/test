[project]
name = "attention-budget"
version = "0.1.0"
description = "Daily attention budget: AI picks a few items from Bilibili and Xiaohongshu"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2",
    "bilibili-api-python>=17.4,<18",
    "httpx",
    "rapidocr_onnxruntime",
    "openai",
    "python-telegram-bot>=21",
    "qrcode",
]

[project.scripts]
attention-budget = "attention_budget.cli:main"

[project.gui-scripts]
attention-budget-bg = "attention_budget.cli:main"

[dependency-groups]
dev = ["pytest", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attention_budget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
